# Release — publish a production release of @vibecontrols/vibe-plugin-* to npmjs
#
# Trigger: CalVer git tag push, or manual workflow_dispatch with an explicit version.
# Publishes to: https://www.npmjs.com/ (public)
#
# CalVer: YYYY.MDD.PATCH (semver-compatible, no zero-padding)
# NPM token: NPMJS_VIBECONTROLS_TOKEN (repo secret, granular token for the @vibecontrols scope)
#
# BOFF-9610: runs on GitHub-hosted runners (the self-hosted org-runners /
# frontend-runners pools are retired) and no longer publishes to the retired
# Verdaccio registry.

name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "CalVer version (e.g., 2026.323.1). Required for manual runs."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release to npmjs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & type check
        run: bun run lint && bun run type:check

      - name: Build
        run: bun run build

      - name: Pre-cache npm CLI
        run: bunx npm@latest --version

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          NAME=$(bun -e "console.log(require('./package.json').name)")

          if [ "$EVENT_NAME" = "push" ] && [ -n "$REF_NAME" ]; then
            VERSION="$REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            echo "::error::workflow_dispatch requires an explicit 'version' input (auto-increment removed to stop version inflation)"
            exit 1
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]{4}\.[1-9][0-9]{0,3}\.[0-9]+$'; then
            echo "::error::Invalid CalVer version: $VERSION (expected YYYY.MDD.PATCH)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Releasing: ${NAME}@$VERSION"

      - name: Publish to npmjs (public)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_VIBECONTROLS_TOKEN }}
          PKG_NAME: ${{ steps.version.outputs.name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > .npmrc << 'NPMRC'
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          sed -i 's/^ *//' .npmrc
          bunx npm@latest version "$PKG_VERSION" --no-git-tag-version --allow-same-version
          if bunx npm@latest view "${PKG_NAME}@${PKG_VERSION}" version --registry "https://registry.npmjs.org/" >/dev/null 2>&1; then
            echo "npmjs already has ${PKG_NAME}@${PKG_VERSION}; skipping"
          else
            bunx npm@latest publish --registry "https://registry.npmjs.org/" --tag latest --access public --ignore-scripts
          fi

      - name: Create git tag (if manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          PKG_NAME: ${{ steps.version.outputs.name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --local user.email "oss@vibecontrols.com"
          git config --local user.name "CI"
          if git rev-parse "$PKG_VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$PKG_VERSION" >/dev/null 2>&1; then
            echo "Tag $PKG_VERSION already exists; skipping"
          else
            git tag "$PKG_VERSION" -m "Release ${PKG_NAME}@${PKG_VERSION}"
            git push origin "$PKG_VERSION"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "${NAME}@${VERSION}" \
            --notes "## ${NAME}@${VERSION}

          ### Install
          \`\`\`bash
          npm install ${NAME}@${VERSION}
          # or
          bun add ${NAME}@${VERSION}
          \`\`\`" \
            --latest \
            2>/dev/null || echo "Release already exists"

      - name: Summary
        if: always()
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Production Release"
            echo "**Package**: \`${NAME}@${VERSION}\`"
            echo "**npmjs**: Published or already present (public)"
          } >> "$GITHUB_STEP_SUMMARY"
