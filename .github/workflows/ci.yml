# CI — lint, type check and build on every PR and push to main
#
# Publishing is done by release.yml (CalVer tag or manual dispatch -> npmjs).
#
# BOFF-9610: runs on GitHub-hosted runners (the self-hosted org-runners /
# frontend-runners pools are retired). The per-push publish to the retired
# Verdaccio registry was removed. The "PR Gate" job emits the status context
# that the main-branch ruleset requires.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Lockfile drift guard
        run: |
          set -euo pipefail
          if [ ! -f package.json ] || [ ! -f bun.lock ]; then
            echo "No package.json/bun.lock — skipping drift check"
            exit 0
          fi
          tmp=$(mktemp -d)
          cp package.json bun.lock "$tmp/"
          [ -f bunfig.toml ] && cp bunfig.toml "$tmp/"
          (cd "$tmp" && bun install --lockfile-only) >/dev/null 2>&1
          if ! cmp -s "$tmp/bun.lock" bun.lock; then
            echo "::error::bun.lock is out of sync with package.json — must be regenerated and committed"
            diff -u bun.lock "$tmp/bun.lock" | head -60 || true
            exit 1
          fi
          echo "bun.lock in sync with package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type:check

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

  # Aggregator status required by the main-branch ruleset ("PR Gate").
  pr-gate:
    name: PR Gate
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Test & Build $RESULT — PR Gate fails"
            exit 1
          fi
          echo "Test & Build passed — PR Gate green"
